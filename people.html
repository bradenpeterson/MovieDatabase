<html>

<head>
    <title>CS2410 Final Project</title>
    <script src="config.js" defer></script>
    <script src="api.js" defer></script>
    <script src="people.js" defer></script>
    <script src="util.js" defer></script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=chevron_left,chevron_right,home,menu,movie,person,star,tv_gen" />
    <link rel="stylesheet" href="styling.css" />
</head>

<body>
    <div id="side-menu">
        <div id="side-menu-title">Menu</div>
        <div id="menu-items">
            <div id="home-container">
                <div class="material-symbols-outlined">home</div>
                <a class="menu-item" id="home-menu-button" href="index.html">Home</a>
            </div>
            <div id="movie-container">
                <div class="material-symbols-outlined">movie</div>
                <a class="menu-item" id="movie-menu-button" href="movies.html">Movies</a>
            </div>
            <div id="tv-container">
                <div class="material-symbols-outlined">tv_gen</div>
                <a class="menu-item" id="tv-menu-button" href="tv.html">Television</a>
            </div>
            <div id="people-container">
                <div class="material-symbols-outlined">person</div>
                <a class="menu-item active" id="person-menu-button" href="people.html">People</a>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>

    <div id="menu-bar">
        <button id="menu-button">
            <span class="material-symbols-outlined">menu</span>
        </button>
        <div id="website-name-text">MovieDB</div>
    </div>

    <h1>People</h1>

    <div id="search-container">
        <input id="search-input" type="text" placeholder="Search for people..." />
        <div id="button-div">
            <a class="find-button" id="search-button" href="people.html">Find</a>
        </div>
    </div>

    <div id="results-info"></div>
    <div id="cards-container"></div>

    <div id="pages-container" class="hidden">
        <button class="pages-button" id="prev-button">
            <span class="material-symbols-outlined">chevron_left</span>
            Previous
        </button>
        <div class="page-info">
            <span id="current-page">1</span> of <span id="total-pages">1</span>
        </div>
        <button class="pages-button" id="next-button">
            Next
            <span class="material-symbols-outlined">chevron_right</span>
        </button>
    </div>
</body>

</html>
