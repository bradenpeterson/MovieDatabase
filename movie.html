<html>

<head>
    <title>CS2410 Final Project</title>
    <script src="api.js" defer></script>
    <script src="movie.js" defer></script>
    <script src="util.js" defer></script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=home,menu,movie,person,star,tv_gen" />
    <link rel="stylesheet" href="styling.css" />
</head>

<body>
    <div id="side-menu">
        <div id="side-menu-title">Menu</div>
        <div id="menu-items">
            <div id="home-container">
                <div class="material-symbols-outlined">home</div>
                <a class="menu-item" id="home-menu-button" href="index.html">Home</a>
            </div>
            <div id="movie-container">
                <div class="material-symbols-outlined">movie</div>
                <a class="menu-item" id="movie-menu-button" href="movies.html">Movies</a>
            </div>
            <div id="tv-container">
                <div class="material-symbols-outlined">tv_gen</div>
                <a class="menu-item" id="tv-menu-button" href="tv.html">Television</a>
            </div>
            <div id="people-container">
                <div class="material-symbols-outlined">person</div>
                <a class="menu-item" id="person-menu-button" href="people.html">People</a>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>

    <div id="menu-bar">
        <button id="menu-button">
            <span class="material-symbols-outlined">menu</span>
        </button>
        <div id="website-name-text">MovieDB</div>
    </div>

    <div id="movie-title" class="title"></div>

    <div class="information-container">
        <div class="basic-information">
            <div id="release-date"></div>
            <div id="runtime"></div>
        </div>
        <div id="vote-average"></div>
        <div id="overview"></div>
    </div>
    
    <div id="image-carousel-container"></div>

    <div id="movie-cast-title" class="cast-title">Cast:</div>
    <div id="cast-container"></div>
</body>

</html>
