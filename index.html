<html>

<head>
    <title>CS2410 Final Project</title>
    <script src="api.js" defer></script>
    <script src="index.js" defer></script>
    <script src="util.js" defer></script>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=home,menu,movie,person,star,tv_gen" />
    <link rel="stylesheet" href="styling.css" />
</head>

<body>
    <div id="side-menu">
        <div id="side-menu-title">Menu</div>
        <div id="menu-items">
            <div id="home-container">
                <div class="material-symbols-outlined">home</div>
                <a class="menu-item active" id="home-menu-button" href="index.html">Home</a>
            </div>
            <div id="movie-container">
                <div class="material-symbols-outlined">movie</div>
                <a class="menu-item" id="movie-menu-button" href="movies.html">Movies</a>
            </div>
            <div id="tv-container">
                <div class="material-symbols-outlined">tv_gen</div>
                <a class="menu-item" id="tv-menu-button" href="tv.html">Television</a>
            </div>
            <div id="people-container">
                <div class="material-symbols-outlined">person</div>
                <a class="menu-item" id="person-menu-button" href="people.html">People</a>
            </div>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>

    <div id="menu-bar">
        <button id="menu-button">
            <span class="material-symbols-outlined">menu</span>
        </button>
        <div id="website-name-text">MovieDB</div>
    </div>

    <h1>Welcome to MovieDB</h1>

    <div id="search-container">
        <input type="text" id="search-input" placeholder="Search for movies, TV shows, or people...">
        <select id="search-mode">
            <option value="all">All</option>
            <option value="movie">Movies</option>
            <option value="tv">TV Shows</option>
            <option value="person">People</option>
        </select>
        <button id="search-button" onclick="searchMovies()">Search</button>
    </div>
    
    <div id="section-display">
        <div id="movie-section">
            <a class="section-header" id="movie-button" href="movies.html">Movies</a>
        </div>
        <div id="tv-section">
            <a class="section-header" id="tv-button" href="tv.html">Television</a>
        </div>
        <div id="people-section">
            <a class="section-header" id="person-button" href="people.html">People</a>
        </div>
    </div>
</body>

</html>
